# ============================================================
# 本地 / 单机 Docker 部署
#
#   docker compose up --build
#
# 两个服务：
#   mysql —— 与线上同版本（8.0），数据落在 named volume
#   app   —— 后端 + 前端静态产物
#
# ⚠️ 线上目前仍跑 systemd + 服务器自带 MySQL。
#    这个 compose 先用于**本地验证**，验证通过再考虑切换线上部署方式。
#    保留 systemd 作为兜底，别把生产环境当成第一个试验场。
# ============================================================

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内连的是 compose 里的 mysql，不是宿主机
      DATABASE_URL: mysql+pymysql://aboutme:aboutme@mysql:3306/about_me_agent?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # 语料 / 向量库 / 缓存持久化到宿主机
      - ./data:/app/data
      # 模型缓存：重建镜像时不用重新下载 BGE
      - model_cache:/root/.cache/huggingface
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: about_me_agent
      MYSQL_USER: aboutme
      MYSQL_PASSWORD: aboutme
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动建表
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
  model_cache:
