# ============================================================
# About_Me_Agent 的 Nginx 配置
# 放置位置（服务器）：/etc/nginx/conf.d/aboutme.conf
#
# 它干的事：Nginx 站在最前面听 80 端口，把请求转发给后面的
# uvicorn（127.0.0.1:8000）。这样公网只看到 Nginx，Python 藏起来。
# ============================================================


# ------------------------------------------------------------
# 1) 上游（upstream）：后端在哪
# ------------------------------------------------------------
# 给后端起个名字，下面 location 里写 aboutme_backend 就行。
# 好处：以后换端口、加机器、做负载均衡，只改这一处。
upstream aboutme_backend {
    server 127.0.0.1:8000;

    # 和 uvicorn 保持长连接，省掉每个请求重新 TCP 握手。
    # 不加这行，Nginx 默认每个请求都新建连接。32 = 每个 worker 最多
    # 缓存 32 条空闲连接备用。
    keepalive 32;
}


# ------------------------------------------------------------
# 2) 限流区（第二道闸）
# ------------------------------------------------------------
# 应用层已经有「每 IP 每分钟 10 次」的限流（app.py 里的 _check_rate）。
# 这里再加一道粗粒度的、在 Nginx 层就把洪水挡掉的闸，洪水根本进不到 Python。
#
# 10r/s    = 每 IP 平均每秒 10 个请求
# burst=20 = 允许瞬间突发 20 个，多的排队
# nodelay  = burst 内立刻放行，不排队等待
#
# $binary_remote_addr 是客户端 IP 的二进制形式，比 $remote_addr 省内存。
# zone=aboutme_api:10m = 开一块 10MB 的内存存 IP 计数（约存 16 万个 IP）。
limit_req_zone $binary_remote_addr zone=aboutme_api:10m rate=10r/s;


# ------------------------------------------------------------
# 3) 站点配置
# ------------------------------------------------------------
server {
    listen 80;
    # 显式写上 IP：即使服务器上还有别的 default_server，
    # 只要请求的 Host 是这个 IP，Nginx 就会优先选中我们这个 server。
    server_name 8.148.192.49;

    # ---------- 反代「三件套」：把真实客户端信息透传给后端 ----------
    # 不写这几行，后端看到的每个请求都来自 127.0.0.1（Nginx 自己），
    # 你的「按 IP 限流」就会退化成「全站共享一个配额」。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 和后端用 HTTP/1.1 通信。
    # SSE（服务器推送）必须 1.1，用 1.0 会退化成非流式。
    # 同时配合 upstream 的 keepalive：Connection 置空才允许复用长连接。
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    # ---------- 【本项目最关键的两行】SSE 流式专用 ----------
    # Nginx 默认会把后端响应先「攒一攒」再发给浏览器（缓冲）。
    # 聊天是流式的，攒住 = 用户盯着转圈半天不蹦一个字。
    # 关掉缓冲：后端吐一个字，Nginx 立刻转发一个字。
    proxy_buffering off;
    proxy_cache off;

    # 后端最多可以「憋」多久不说话。LLM 首字可能要等 10 秒以上，
    # 官方默认 60s 通常够，设 300s 更保险（防长回答被掐断）。
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ---------- 请求体大小 ----------
    # 默认 1MB，以后传文档/简历会超；先给 10MB。
    client_max_body_size 10m;

    # ---------- 静态资源 gzip 压缩 ----------
    # 文本类资源压到 1/3 左右，省带宽、加载更快。
    # 注意：图片/视频本身已压缩，压了没用，所以只列文本类型。
    gzip on;
    gzip_min_length 1k;          # 太小的文件压了反而更慢
    gzip_comp_level 5;           # 1-9，5 是压缩率/CPU 的平衡点
    gzip_types text/plain text/css application/json
               application/javascript text/javascript
               application/xml image/svg+xml;
    # 让 Nginx 和 CDN 之间也走压缩（有些代理只在带这个头时才压缩）
    gzip_vary on;

    # ============================================================
    # 路由规则
    # ============================================================

    # ---------- API：转发给 FastAPI ----------
    # 用正则匹配这些前缀：/login /register /sessions... /api/...
    # 注意 Nginx 优先级：正则 location 高于普通前缀 location（/）。
    location ~ ^/(login|register|sessions|api)(/|$) {
        limit_req zone=aboutme_api burst=20 nodelay;

        # 结尾不带 / 也不带 URI：原样保留请求路径。
        # 例：/sessions/abc/chat → 后端收到的还是 /sessions/abc/chat
        proxy_pass http://aboutme_backend;
    }

    # ---------- 旧版原生前端（FastAPI 自己托管的 static/） ----------
    location /static/ {
        proxy_pass http://aboutme_backend;
    }

    # ---------- 阶段 A：首页也先交给 FastAPI ----------
    location / {
        proxy_pass http://aboutme_backend;
    }

    # ============================================================
    # 阶段 B（等阶段 A 验证通过后再启用）：
    # 让 Nginx 直接托管 Vue 的打包产物，彻底绕开 Python。
    # 做法：
    #   1. 本地 npm run build → 得到 frontend/dist/
    #   2. 上传到服务器 /var/www/aboutme/
    #   3. 打开下面这段，并删掉上面「阶段 A」的 location /
    # ------------------------------------------------------------
    # root /var/www/aboutme;
    # index index.html;
    #
    # location / {
    #     # 先找真实文件，找不到就回落给 index.html。
    #     # Vue 用 history 路由时，刷新 /sessions/abc 这种深链接
    #     # 服务器上并没有这个文件，交给前端自己路由。
    #     try_files $uri $uri/ /index.html;
    # }
    # ============================================================
}
