# ============================================================
# About_Me_Agent 的 Nginx 配置
# 放置位置（服务器）：/etc/nginx/conf.d/aboutme.conf
#
# 架构（阶段 B：Nginx 直接托管前端静态产物）：
#
#   浏览器 ──:80──> Nginx ──┬── /            → /var/www/aboutme（Vue 打包产物，Nginx 直接读盘）
#                           ├── /assets/...  → 同上（带长缓存头）
#                           └── /login /register /sessions /api → 127.0.0.1:8000（FastAPI）
#
#   好处：静态文件不经过 Python，不占 FastAPI 的 worker；
#        后端只管 API，职责清晰。
# ============================================================


# ------------------------------------------------------------
# 1) 上游（upstream）：后端在哪
# ------------------------------------------------------------
# 给后端起个名字，下面 location 里写 aboutme_backend 就行。
# 好处：以后换端口、加机器、做负载均衡，只改这一处。
upstream aboutme_backend {
    server 127.0.0.1:8000;

    # 和 uvicorn 保持长连接，省掉每个请求重新 TCP 握手。
    # 32 = 每个 worker 最多缓存 32 条空闲连接备用。
    keepalive 32;
}


# ------------------------------------------------------------
# 2) 限流区（第二道闸）
# ------------------------------------------------------------
# 应用层已有「每 IP 每分钟 10 次」的限流（app.py 的 _check_rate）。
# 这里再加一道粗粒度的、在 Nginx 层就把洪水挡掉的闸。
#
# 10r/s    = 每 IP 平均每秒 10 个请求
# burst=20 = 允许瞬间突发 20 个，多的排队
# nodelay  = burst 内立刻放行，不排队等待
limit_req_zone $binary_remote_addr zone=aboutme_api:10m rate=10r/s;


# ------------------------------------------------------------
# 3) 站点配置
# ------------------------------------------------------------
server {
    listen 80;
    server_name 8.148.192.49;

    # ---------- 反代「三件套」：把真实客户端信息透传给后端 ----------
    # 不写这几行，后端看到的每个请求都来自 127.0.0.1（Nginx 自己），
    # 「按 IP 限流」会退化成「全站共享一个配额」。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 和后端用 HTTP/1.1 通信。SSE（服务器推送）必须 1.1。
    # Connection 置空才允许复用 upstream 的长连接。
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    # 默认 1MB，以后传文档会超；先给 10MB
    client_max_body_size 10m;

    # ---------- gzip 压缩 ----------
    # 只压文本类；图片/视频本身已压缩，压了白费 CPU
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json
               application/javascript text/javascript
               application/xml image/svg+xml;
    gzip_vary on;

    # ============================================================
    # 路由规则
    # ============================================================
    # 注意 Nginx 的优先级：正则 location（~）> 前缀 location（/）。
    # 所以下面的 API 正则会先于 `location /` 命中。

    # ---------- 健康检查 ----------
    # 精确匹配（= /healthz）优先级最高，不会被下面的 location / 抢走
    # （否则 /healthz 会命中 try_files 回落、返回前端 HTML，而不是健康 JSON）。
    # access_log off：监控可能每几秒探一次，别让它刷满访问日志。
    location = /healthz {
        proxy_pass http://aboutme_backend;
        access_log off;
    }

    # ---------- 后端 API：转发给 FastAPI ----------
    location ~ ^/(login|register|sessions|api)(/|$) {
        limit_req zone=aboutme_api burst=20 nodelay;

        # 结尾不带 / 也不带 URI：原样保留请求路径。
        # 例：/sessions/abc/chat → 后端收到的还是 /sessions/abc/chat
        proxy_pass http://aboutme_backend;

        # ---- 【本项目最关键的两行】SSE 流式专用 ----
        # Nginx 默认会把响应先「攒一攒」再发给浏览器。
        # 聊天是流式的，攒住 = 用户盯着转圈半天不蹦一个字。
        # 关掉缓冲：后端吐一个字，Nginx 立刻转发一个字。
        # 注意只在这个 location 关——静态文件不受影响。
        proxy_buffering off;
        proxy_cache off;

        # 后端最多可以「憋」多久不说话。LLM 首字可能要等十几秒。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 前端静态产物（Vue 打包结果）----------
    # 由 Nginx 直接读盘，不经过 Python。
    root /var/www/aboutme;
    index index.html;

    # Vite 打包出的文件名带内容哈希（如 index--Gd7tjBT.js），
    # 内容一变文件名就变 → 可以放心让浏览器长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 其余路径一律交给前端。
    # try_files：先找真实文件，找不到就回落到 index.html。
    # （本项目没用 vue-router，但保留这行是 SPA 的标准做法，
    #   以后加深链接路由时不会因为刷新 404。）
    location / {
        try_files $uri $uri/ /index.html;
    }
}


