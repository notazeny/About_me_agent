# ============================================================
# Nginx 反向代理「骨架」（模板）
#
# 用法：复制一份改名成 <项目名>.conf，把 <...> 占位符填掉，
#       放到服务器的 /etc/nginx/conf.d/ 下。
#
# 说明：带【照抄】标记的，任何项目都一样，原样保留；
#       带【必改】标记的，换了项目就必须替换。
#       没标记的是「场景开关」，按需取舍（不用的直接删）。
# ============================================================


# 【必改】<后端名> 取个你记得住的名字，下面 location 里要用它
# 【必改】127.0.0.1:<后端端口> 换成你后端真实的监听地址
upstream <后端名> {
    server 127.0.0.1:<后端端口>;
    keepalive 32;        # 【照抄】和后端保持长连接
}

server {
    # 【照抄】监听端口。本机直连测试用 80；上 HTTPS 时加 443 那块
    listen 80;

    # 【必改】你的域名；还没域名就写服务器公网 IP
    server_name <域名或IP>;

    # ---------- 反代「四件套」---------- 【照抄，一行都别改】
    # 作用：把真实客户端信息透传给后端。
    # 不写这几行，后端看到的每个请求 IP 都是 127.0.0.1，
    # 「按 IP 限流」「按 IP 记日志」全部失效。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- 协议与长连接 ---------- 【照抄】
    proxy_http_version 1.1;      # 1.0 不支持流式（SSE 会退化成一次性）
    proxy_set_header Connection "";   # 配合上面 upstream 的 keepalive

    # ---------- 场景开关（按需打开，不用就删）----------
    # proxy_buffering off;       # 【有 SSE / 流式响应才要】关掉响应缓冲，逐字转发
    # proxy_cache off;           # 【同上】一起关
    # proxy_read_timeout 300s;   # 【有慢接口才要】LLM 生成、大文件处理等
    # proxy_send_timeout 300s;
    # client_max_body_size 10m;  # 【有文件上传才要】默认只有 1MB
    # limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;  # 【要边缘防刷才要】
    #   注意：limit_req_zone 要写在 http 层（也就是 server {} 外面）

    # ---------- gzip 压缩 ---------- 【照抄】
    # 只压文本类；图片/视频本身已压缩，压了白费 CPU
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json
               application/javascript text/javascript
               application/xml image/svg+xml;
    gzip_vary on;

    # ---------- 路由 ----------
    # 【必改】你的 API 前缀是什么，就写什么
    # （本项目是 /login /register /sessions /api）
    # location ~ ^/(<接口前缀1>|<接口前缀2>)(/|$) {
    #     limit_req zone=api burst=20 nodelay;   # 开了限流才写
    #     proxy_pass http://<后端名>;
    # }

    # 【必改】没被上面接住的，全给后端（或改成 try_files 走静态文件）
    location / {
        proxy_pass http://<后端名>;
    }
}
