<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sazeny · AI 分身</title>
<style>
  :root {
    --bg: #f7f7f8;
    --sidebar: #202123;
    --accent: #4f46e5;
    --border: #e5e5e5;
    --text: #1f1f1f;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg); }
  .app { display: flex; height: 100vh; }

  /* 侧边栏 */
  .sidebar { width: 260px; background: var(--sidebar); color: #ececf1; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 14px; }
  .brand { font-weight: 700; font-size: 15px; margin-bottom: 10px; }
  #new-chat { width: 100%; padding: 10px; border: 1px solid #4a4a52; border-radius: 8px; background: transparent; color: #ececf1; cursor: pointer; font-size: 14px; }
  #new-chat:hover { background: #2a2b32; }
  .session-list { flex: 1; overflow-y: auto; padding: 6px; }
  .session-item { display: flex; align-items: center; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; gap: 6px; }
  .session-item:hover { background: #2a2b32; }
  .session-item.active { background: #343541; }
  .session-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .del { color: #8e8ea0; border: none; background: none; cursor: pointer; display: none; }
  .session-item:hover .del { display: inline; }
  .session-item .del:hover { color: #f87171; }
  .sidebar-footer { padding: 12px; border-top: 1px solid #2a2b32; display: flex; flex-direction: column; gap: 8px; }
  .sidebar-footer a, .sidebar-footer button { color: #c5c5d2; text-decoration: none; font-size: 13px; background: none; border: none; text-align: left; cursor: pointer; }
  .sidebar-footer a:hover, .sidebar-footer button:hover { color: #fff; }

  /* 主区 */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header { padding: 12px 20px; border-bottom: 1px solid var(--border); background: #fff; font-size: 13px; color: var(--muted); }
  .messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 760px; margin: 0 auto 16px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.6; word-break: break-word; }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; max-width: 70%; white-space: pre-wrap; }
  .msg.assistant .bubble { background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .sources-toggle { margin-top: 8px; }
  .sources-toggle > button { font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; }
  .sources { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; display: none; }
  .sources.open { display: block; }
  .source-item { margin-bottom: 10px; }
  .source-item .src { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .source-item .txt { font-size: 13px; color: #374151; white-space: pre-wrap; background: #f9fafb; padding: 8px; border-radius: 6px; }
  .input-bar { padding: 14px 20px; border-top: 1px solid var(--border); background: #fff; display: flex; gap: 10px; }
  #input { flex: 1; resize: none; height: 48px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; font-family: inherit; }
  #send { padding: 0 20px; background: var(--accent); color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty-hint { color: var(--muted); text-align: center; margin-top: 60px; }

  /* markdown 渲染样式（回答 + 作品集共用） */
  .bubble h1, .bubble h2, .bubble h3, .bubble h4,
  .modal-body h1, .modal-body h2, .modal-body h3, .modal-body h4 { margin: 12px 0 6px; }
  .bubble h1, .modal-body h1 { font-size: 19px; }
  .bubble h2, .modal-body h2 { font-size: 18px; }
  .bubble h3, .modal-body h3 { font-size: 16px; }
  .bubble h4, .modal-body h4 { font-size: 15px; }
  .bubble p, .modal-body p { margin: 6px 0; }
  .bubble ul, .bubble ol, .modal-body ul, .modal-body ol { margin: 6px 0 6px 22px; }
  .bubble code, .modal-body code { background: #f1f1f3; padding: 2px 5px; border-radius: 4px; font-size: 13px; }
  .bubble pre, .modal-body pre { background: #f6f6f8; padding: 10px; border-radius: 8px; overflow-x: auto; }
  .bubble pre code, .modal-body pre code { background: none; padding: 0; }
  .bubble table, .modal-body table { border-collapse: collapse; margin: 10px 0; font-size: 13px; width: 100%; }
  .bubble th, .bubble td, .modal-body th, .modal-body td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .bubble th, .modal-body th { background: #f4f4f5; }
  .bubble a, .modal-body a { color: var(--accent); }

  /* 弹窗 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal.open { display: flex; }
  .modal-box { background: #fff; width: min(860px, 90vw); height: 80vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h2 { font-size: 16px; }
  #close-modal { border: none; background: none; font-size: 22px; cursor: pointer; color: var(--muted); }
  .modal-body { flex: 1; overflow-y: auto; padding: 20px; font-size: 14px; line-height: 1.7; }

  /* 登录弹窗 */
  .login-box { width: min(360px, 90vw); height: auto; }
  .login-body { display: flex; flex-direction: column; gap: 12px; }
  .login-body input { padding: 11px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; }
  .login-actions { display: flex; gap: 10px; }
  .login-actions button { flex: 1; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 15px; border: 1px solid var(--border); background: #fff; }
  .login-actions button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .login-error { color: #ef4444; font-size: 13px; min-height: 18px; }
  .login-hint { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">sazeny · AI 分身</div>
      <button id="new-chat">＋ 新建对话</button>
    </div>
    <div class="session-list" id="session-list"></div>
    <div class="sidebar-footer">
      <a id="github-link" target="_blank" rel="noopener">GitHub</a>
      <a id="gitee-link" target="_blank" rel="noopener">Gitee</a>
      <button id="portfolio-btn">查看作品集 portfolio</button>
      <button id="logout-btn">退出登录</button>
    </div>
  </aside>
  <main class="chat">
    <div class="chat-header">🤖 这是 sazeny 的 AI 分身，可就简历与项目做初步面试；正式沟通请以 sazeny 本人为准。</div>
    <div class="messages" id="messages">
      <div class="empty-hint">问我任何关于 sazeny 的项目、技术栈或求职方向的问题吧。</div>
    </div>
    <div class="input-bar">
      <textarea id="input" placeholder="输入你的问题，Enter 发送、Shift+Enter 换行"></textarea>
      <button id="send">发送</button>
    </div>
  </main>
</div>

<div class="modal" id="portfolio-modal">
  <div class="modal-box">
    <div class="modal-head"><h2>sazeny 的作品集</h2><button id="close-modal">×</button></div>
    <div class="modal-body" id="portfolio-body"></div>
  </div>
</div>

<div class="modal" id="login-modal">
  <div class="modal-box login-box">
    <div class="modal-head"><h2>登录 / 注册</h2></div>
    <div class="modal-body login-body">
      <input id="login-username" placeholder="用户名" autocomplete="username">
      <input id="login-password" type="password" placeholder="密码" autocomplete="current-password">
      <div class="login-error" id="login-error"></div>
      <div class="login-actions">
        <button id="login-btn" class="primary">登录</button>
        <button id="register-btn">注册</button>
      </div>
      <p class="login-hint">注册即创建账号；登录后开始对话。</p>
    </div>
  </div>
</div>

<script>
let currentSessionId = null;

function getToken() { return localStorage.getItem('aboutme_token'); }
function setToken(t) { localStorage.setItem('aboutme_token', t); }
function clearToken() { localStorage.removeItem('aboutme_token'); }

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (getToken()) headers['Authorization'] = 'Bearer ' + getToken();
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 401) { clearToken(); showLogin(); throw new Error('请先登录'); }
  if (!r.ok) {
    let msg = r.status;
    try { const d = await r.json(); msg = d.message || d.detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inline(s) {
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

function mdToHtml(text) {
  const lines = text.split('\n');
  let html = '';
  let i = 0;
  let listBuf = null;
  const closeList = () => { if (listBuf) { html += '</' + listBuf + '>'; listBuf = null; } };

  while (i < lines.length) {
    const line = lines[i];

    if (line.trim().startsWith('```')) {
      closeList();
      html += '<pre><code>';
      i++;
      const buf = [];
      while (i < lines.length && !lines[i].trim().startsWith('```')) { buf.push(lines[i]); i++; }
      html += escapeHtml(buf.join('\n')) + '</code></pre>';
      i++;
      continue;
    }

    if (line.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes('-')) {
      closeList();
      const headerCells = line.split('|').map(c => c.trim()).filter(c => c !== '');
      i += 2;
      html += '<table><thead><tr>';
      headerCells.forEach(c => html += '<th>' + inline(escapeHtml(c)) + '</th>');
      html += '</tr></thead><tbody>';
      while (i < lines.length && lines[i].includes('|')) {
        const cells = lines[i].split('|').map(c => c.trim());
        if (cells[0] === '') cells.shift();
        if (cells[cells.length - 1] === '') cells.pop();
        html += '<tr>';
        cells.forEach(c => html += '<td>' + inline(escapeHtml(c)) + '</td>');
        html += '</tr>';
        i++;
      }
      html += '</tbody></table>';
      continue;
    }

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); html += '<h' + h[1].length + '>' + inline(escapeHtml(h[2])) + '</h' + h[1].length + '>'; i++; continue; }

    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) { if (listBuf !== 'ul') { closeList(); html += '<ul>'; listBuf = 'ul'; } html += '<li>' + inline(escapeHtml(ul[1])) + '</li>'; i++; continue; }

    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ol) { if (listBuf !== 'ol') { closeList(); html += '<ol>'; listBuf = 'ol'; } html += '<li>' + inline(escapeHtml(ol[1])) + '</li>'; i++; continue; }

    if (line.trim() === '') { closeList(); i++; continue; }

    closeList();
    html += '<p>' + inline(escapeHtml(line)) + '</p>';
    i++;
  }
  closeList();
  return html;
}

async function loadLinks() {
  try {
    const d = await api('/api/links');
    document.getElementById('github-link').href = d.github;
    document.getElementById('gitee-link').href = d.gitee;
  } catch (e) { console.error(e); }
}

async function loadSessions(selectFirst = true) {
  const data = await api('/sessions');
  const list = data.items || data;   // 后端返回分页 {items, total}，取 items
  const box = document.getElementById('session-list');
  box.innerHTML = '';
  for (const s of list) {
    const item = el('div', 'session-item' + (s.id === currentSessionId ? ' active' : ''));
    item.appendChild(el('span', 'title', s.title || '新对话'));
    const del = el('button', 'del', '✕');
    del.onclick = async (ev) => {
      ev.stopPropagation();
      await api('/sessions/' + s.id, { method: 'DELETE' });
      if (currentSessionId === s.id) currentSessionId = null;
      await loadSessions();
    };
    item.appendChild(del);
    item.onclick = () => selectSession(s.id);
    box.appendChild(item);
  }
  if (list.length === 0) {
    const s = await api('/sessions', { method: 'POST' });
    currentSessionId = s.id;
    await loadSessions();
  } else if (selectFirst && !currentSessionId) {
    selectSession(list[0].id);
  }
}

function buildSourcesToggle(sources) {
  const box = el('div', 'sources-toggle');
  const btn = el('button', null, '查看源文本（' + sources.length + '）');
  const srcs = el('div', 'sources');
  for (const s of sources) {
    const si = el('div', 'source-item');
    const label = s.source === 'persona_qa.md' ? 'sazeny 原话' : '语料 · ' + s.source;
    si.appendChild(el('div', 'src', label));
    si.appendChild(el('div', 'txt', s.text));
    srcs.appendChild(si);
  }
  btn.onclick = () => srcs.classList.toggle('open');
  box.appendChild(btn);
  box.appendChild(srcs);
  return box;
}

function renderMessage(m) {
  const wrap = el('div', 'msg ' + m.role);
  const bubble = el('div', 'bubble');
  if (m.role === 'assistant') {
    bubble.innerHTML = mdToHtml(m.content);
  } else {
    bubble.textContent = m.content;
  }
  wrap.appendChild(bubble);
  if (m.role === 'assistant' && m.sources && m.sources.length) {
    bubble.appendChild(buildSourcesToggle(m.sources));
  }
  return wrap;
}

async function selectSession(id) {
  currentSessionId = id;
  const s = await api('/sessions/' + id);
  const box = document.getElementById('messages');
  box.innerHTML = '';
  if (!s.messages.length) {
    box.appendChild(el('div', 'empty-hint', '问我任何关于 sazeny 的项目、技术栈或求职方向的问题吧。'));
  } else {
    for (const m of s.messages) box.appendChild(renderMessage(m));
    box.scrollTop = box.scrollHeight;
  }
  await loadSessions(false);
}

async function send() {
  const input = document.getElementById('input');
  const q = input.value.trim();
  if (!q || !currentSessionId) return;
  input.value = '';
  const box = document.getElementById('messages');
  const hint = box.querySelector('.empty-hint');
  if (hint) hint.remove();
  box.appendChild(renderMessage({ role: 'user', content: q }));
  const sendBtn = document.getElementById('send');
  sendBtn.disabled = true;

  const wrap = el('div', 'msg assistant');
  const bubble = el('div', 'bubble', '思考中…');
  wrap.appendChild(bubble);
  box.appendChild(wrap);
  box.scrollTop = box.scrollHeight;

  let sources = [];
  try {
    const resp = await fetch('/sessions/' + currentSessionId + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
      body: JSON.stringify({ question: q }),
    });
    if (!resp.ok) {
      let msg = resp.status;
      try { const d = await resp.json(); msg = d.message || d.detail || msg; } catch (e) {}
      throw new Error(msg);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let answerText = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const raw = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const line = raw.trim();
        if (!line.startsWith('data:')) continue;
        let data;
        try { data = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
        if (data.delta) {
          answerText += data.delta;
          bubble.textContent = answerText;   // 打字机：流式期间先纯文本，避免每帧重渲染 markdown
          box.scrollTop = box.scrollHeight;
        }
        if (data.done) {
          sources = data.sources || [];
        }
      }
    }
    bubble.innerHTML = mdToHtml(answerText);   // 流完一次性转 markdown
    if (sources && sources.length) bubble.appendChild(buildSourcesToggle(sources));
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    bubble.textContent = '[出错了] ' + e.message;
  } finally {
    sendBtn.disabled = false;
    await loadSessions(false);
  }
}

document.getElementById('new-chat').onclick = async () => {
  const s = await api('/sessions', { method: 'POST' });
  currentSessionId = s.id;
  await loadSessions();
  await selectSession(s.id);
};
document.getElementById('send').onclick = send;
document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('portfolio-btn').onclick = async () => {
  const d = await api('/api/portfolio');
  document.getElementById('portfolio-body').innerHTML = mdToHtml(d.markdown);
  document.getElementById('portfolio-modal').classList.add('open');
};
document.getElementById('close-modal').onclick = () => document.getElementById('portfolio-modal').classList.remove('open');
document.getElementById('portfolio-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('portfolio-modal')) document.getElementById('portfolio-modal').classList.remove('open');
});

// ---- 登录 / 注册 ----
function showLogin() { document.getElementById('login-modal').classList.add('open'); }
function hideLogin() { document.getElementById('login-modal').classList.remove('open'); }
function setLoginError(m) { document.getElementById('login-error').textContent = m; }

async function doLogin() {
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  if (!u || !p) { setLoginError('请输入用户名和密码'); return; }
  try {
    const d = await api('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p }),
    });
    setToken(d.token);
    hideLogin();
    document.getElementById('login-password').value = '';
    setLoginError('');
    await loadSessions();
  } catch (e) { setLoginError(e.message); }
}

async function doRegister() {
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  if (!u || !p) { setLoginError('请输入用户名和密码'); return; }
  try {
    await api('/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p }),
    });
    setLoginError('注册成功，正在登录…');
    await doLogin();
  } catch (e) { setLoginError(e.message); }
}

function logout() {
  clearToken();
  currentSessionId = null;
  document.getElementById('session-list').innerHTML = '';
  const box = document.getElementById('messages');
  box.innerHTML = '';
  box.appendChild(el('div', 'empty-hint', '已退出登录'));
  showLogin();
}

document.getElementById('login-btn').onclick = doLogin;
document.getElementById('register-btn').onclick = doRegister;
document.getElementById('logout-btn').onclick = logout;
document.getElementById('login-password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});

loadLinks();
if (getToken()) {
  loadSessions();
} else {
  showLogin();
}
</script>
</body>
</html>
