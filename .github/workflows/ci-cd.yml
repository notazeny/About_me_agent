# ============================================================
# About_Me_Agent 的 CI/CD 流水线
#
#   CI（持续集成）：每次 push / PR 自动跑测试
#   CD（持续部署）：合并到 main 后自动部署到服务器
#
# 部署方式：rsync 直推（runner 主动连服务器）
#   —— 服务器不需要能访问 GitHub，国内网络下最稳。
#   企业级方案（Docker 镜像 + 镜像仓库）见 learn+/工程化改进待办.md。
# ============================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ★ 手动触发：在仓库的 Actions 页面点「Run workflow」才会跑。
  #   现在 deploy 只认这个事件——push 只跑测试，碰不到线上。
  #   站点已稳定，暂不放开「push 即部署」，免得一次误推打断线上。
  #   想开启全自动：把 deploy job 的 if 改回 push 即可。
  workflow_dispatch:

# 同一分支上如果还有没跑完的，取消旧的——省额度，也别让旧结果覆盖新结果
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 1) 测试：任何 push 和 PR 都会跑
  # ==========================================================
  test:
    name: 测试
    runs-on: ubuntu-latest

    # ★ 用真 MySQL 跑测试，而不是 SQLite。
    #   线上是 MySQL 8，测试跑 SQLite 等于模拟错了对象——
    #   长度校验、字符集/排序规则、caching_sha2_password 认证全都测不到。
    #   这个项目已经吃过一次「CI 全绿但服务器装不上」的亏。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: about_me_agent_test
          MYSQL_USER: aboutme
          MYSQL_PASSWORD: aboutme
        ports:
          - 3306:3306
        # 等 MySQL 真正就绪（健康检查），不靠 sleep 猜
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # conftest.py 读这个变量；没设时才回落到 SQLite
      TEST_DATABASE_URL: mysql+pymysql://aboutme:aboutme@127.0.0.1:3306/about_me_agent_test?charset=utf8mb4

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          # ★ 必须对齐「服务器上的 Python 版本」，而不是开发机。
          #   服务器的 venv 是 3.10（Ubuntu 22.04 自带），开发机是 3.11.9。
          #   曾经写成 3.11，结果 CI 全绿、服务器却装不上 SQLAlchemy 2.1
          #   （它要求 >=3.11）——CI 给了虚假的安全感。
          #   教训：CI 是拿来模拟「运行环境」的，模拟错了对象等于没模拟。
          python-version: "3.10"
          # 缓存 pip 依赖：命中时省 30-60 秒
          cache: pip

      - name: 装依赖
        # ★ 这一步就是 CI 最核心的价值之一：
        #   在一台「干净机器」上按 requirements 从零装。
        #   本机能跑 ≠ 能部署——少写一个包，这里立刻红。
        run: pip install -r requirements-dev.txt

      - name: 跑测试
        # conftest.py 读 TEST_DATABASE_URL（上面 env 设的），连的是真 MySQL
        run: python -m pytest tests/ -v

  # ==========================================================
  # 2) 部署：只在「push 到 main」时跑，PR 不部署
  # ==========================================================
  deploy:
    name: 部署到服务器
    needs: test                      # 测试没过，绝不部署
    # ★ 当前是「手动触发」阶段：只有 Actions 页面点 Run workflow 才会部署。
    #   原因：站点已稳定，暂不放开自动部署，避免误推打断线上。
    #   想开启全自动就改成：
    #     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          # 私钥从 GitHub Secrets 注入，绝不写在仓库里
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 首次连接的指纹：预先写入 known_hosts，避免交互式确认卡住流水线
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          # 把 key 交给 ssh-agent，rsync 会自动复用
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          # 对齐开发机的 Node 版本（本地 v24.14.0）
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        # 在 CI 的干净环境里构建，产物直接上传——
        # 服务器上不装 Node，也不把 node_modules（86MB）同步过去。
        #
        # ★ 放在「同步/重启」之前：构建失败整个 job 立刻停住，
        #   不会出现「后端已更新、前端没跟上」的半新半旧状态。
        run: |
          cd frontend
          # npm ci 严格按 package-lock.json 安装，保证可复现（比 npm install 可靠）
          npm ci
          # vue-tsc 类型检查 + vite 打包 → frontend/dist/
          npm run build

      - name: 同步前端产物到服务器
        # 只传打包结果（几十 KB），目标目录对应 Nginx 里的 `root /var/www/aboutme;`
        # --delete：Vite 产物文件名带内容哈希，旧文件不会自动消失，靠它清掉
        run: |
          rsync -avz --delete \
            frontend/dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/aboutme/

      - name: 同步代码到服务器
        run: |
          # ★ --delete 会删掉服务器上「源目录没有」的文件。
          #   所以 --exclude 列的不是小事：漏掉 .env，你的 API key
          #   和数据库密码会被当场删掉（rsync 的经典事故）。
          #   excluded 的文件既不被传输、也不被删除 —— 天然受保护。
          #
          #   ⚠️ data/semantic_cache.json 也必须排除：
          #      服务器上那份是运行中自己累积的缓存，被仓库里的覆盖 = 缓存被清空。
          #
          #   ⚠️ CLAUDE.md / data/persona/interview_progress.md 也要排除：
          #      这两个是隐私文件，目前**只靠 .gitignore 一道防线挡着**——
          #      而 rsync 根本不看 .gitignore！这里补上第二道：
          #      万一它们将来又出现在仓库里，也同步不到服务器上。
          #
          #   注意：注释只能写在这条命令「前面」——反斜杠续行中间插注释会把命令截断。
          rsync -avz --delete \
            --chown=aboutme:aboutme \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.env' \
            --exclude='CLAUDE.md' \
            --exclude='data/persona/interview_progress.md' \
            --exclude='venv' \
            --exclude='chroma_db' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='tests' \
            --exclude='frontend/node_modules' \
            --exclude='*.db' \
            --exclude='data/semantic_cache.json' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/aboutme/About_Me_Agent/

      - name: 装依赖并重启服务
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash -s <<'REMOTE'
            set -e
            cd /home/aboutme/About_Me_Agent
            # 依赖有变化时补装（写进 requirements 的包必须在这一步落地，
            # 否则代码更新了、依赖没更新 → 上线就 ImportError）
            ./venv/bin/pip install -q -r requirements.txt
            # 改文件 ≠ 改运行中的服务：必须重启才生效
            systemctl restart about_me_agent
            # 顺带 reload Nginx：
            #   · 前端静态产物可能变了，需要它重新读盘
            #   · reload 是平滑重载，不断现有连接，几乎零耗时
            # 放在 restart 之后，前后端在同一次运行里切换，把「半新半旧」的窗口压到最小
            systemctl reload nginx
          REMOTE

      - name: 健康检查（轮询，最多等 60 秒）
        run: |
          # 部署完必须验一下，否则「流水线绿了但站点挂了」会悄悄发生。
          #
          # ★ 不用 sleep 固定等待：后端启动要加载模型，
          #   写死 sleep 3 会误判失败——机器快一点慢一点结论就不同。
          #   改成轮询：就绪即返回，不浪费；最多等 60 秒，不误判。
          #
          # ★ 现在启动更慢了：lifespan 里加了 warm_up()（预热模型 + 建索引），
          #   进程要等预热完才开始接受请求。所以给 curl 加 --max-time——
          #   否则启动期间那一次 curl 会一直挂着，把探测的节奏打乱。
          #   预算放宽到约 5 分钟：正常运行预热只要几秒，
          #   但万一模型缓存丢了（要重新下载）或网络慢，别让部署误判失败。
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash -s <<'REMOTE'
            for i in $(seq 1 60); do
              # 打 /healthz 而不是 /api/links：前者会逐项探测依赖
              # （数据库能不能连、向量库有没有数据），任何一项不通就返回 503。
              # /api/links 只证明「进程活着」，抓不到「起来了但数据库连不上」这种
              # 「绿的但坏的」情况。curl -f 遇到 503 会返回非零 → 继续重试。
              if curl -sf --max-time 5 -o /dev/null http://127.0.0.1/healthz; then
                echo "✅ 健康检查通过（第 ${i} 次探测）"
                curl -s http://127.0.0.1/healthz
                exit 0
              fi
              sleep 2
            done

            # ★ 失败时把日志打出来 —— 这样在 Actions 页面就能看到原因，
            #   不必再 SSH 上去翻 journalctl。CI 的报错要能自解释。
            echo "❌ 等待 60 秒后端仍未就绪，以下是最后 40 行日志："
            systemctl status about_me_agent --no-pager | head -15
            journalctl -u about_me_agent -n 40 --no-pager
            exit 1
          REMOTE
